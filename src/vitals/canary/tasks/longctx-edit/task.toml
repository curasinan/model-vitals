task_id = "longctx-edit"
checker = "diff_golden"
max_turns = 8
allowed_tools = ["Read", "Edit"]
workspace_template = "workspace"
allowed_files = ["module.py"]
long_context = true
per_run_timeout_s = 900
per_run_budget_usd = 1.50

# workspace/module.py and golden/module_expected.py are both generated by
# vitals.canary.longctx.generate_module/solved_module(EDIT_SEED, EDIT_TARGET_LINES) -- see
# tests/test_longctx.py, which pins both committed files against a fresh call to the
# generator so they cannot silently drift from it.
