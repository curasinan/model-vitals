name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: pytest (fast suite)
        run: uv run pytest -q -m "not slow"

      - name: ruff
        run: uv run ruff check .

      - name: mypy (ratchet)
        run: uv run python scripts/mypy_ratchet.py

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }}"
            echo ""
            echo "| gate | mode | result |"
            echo "|---|---|---|"
            echo "| pytest | blocking | ${{ job.status }} |"
            echo "| ruff | blocking | see log |"
            echo "| mypy | ratchet (blocking on growth) | see log |"
          } >> "$GITHUB_STEP_SUMMARY"
